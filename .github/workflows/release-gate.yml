name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: none

jobs:
  release-gate:
    runs-on: ubuntu-latest

    steps:
      - name: "TDS identity: 23f2002204@ds.study.iitm.ac.in"
        run: echo "TDS identity: 23f2002204@ds.study.iitm.ac.in"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start API
        run: |
          uvicorn app:app --host 127.0.0.1 --port 8000 &
          sleep 3

      - name: Test safe release
        run: |
          python - <<'PY'
          import json
          import urllib.request

          payload = {
              "target": "production",
              "event": "push",
              "ref": "refs/heads/main",
              "workflow": {
                  "trigger": "push",
                  "permissions": {
                      "contents": "read",
                      "packages": "write",
                      "id-token": "none"
                  },
                  "testsPassed": True,
                  "matrixComplete": True,
                  "failFast": False,
                  "environmentApproval": True,
                  "actions": [
                      {
                          "owner": "actions",
                          "name": "checkout",
                          "ref": "v4"
                      },
                      {
                          "owner": "third-party",
                          "name": "example",
                          "ref": "0123456789abcdef0123456789abcdef01234567"
                      }
                  ]
              },
              "image": {
                  "multiStage": True,
                  "runsAsRoot": False,
                  "secretMode": "none",
                  "criticalVulnerabilities": 0,
                  "digestPinned": True
              }
          }

          data = json.dumps(payload).encode()

          request = urllib.request.Request(
              "http://127.0.0.1:8000/release-gate",
              data=data,
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          response = urllib.request.urlopen(request)
          result = json.loads(response.read())

          print(result)

          assert result["decision"] == "promote"
          assert result["violations"] == []
          PY
