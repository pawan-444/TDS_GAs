name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: none

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: TDS identity: 23f2002204@ds.study.iitm.ac.in
        run: echo "TDS identity verified"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install fastapi uvicorn pydantic

      - run: python -m py_compile app.py